name: CI/CD - Tests & Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

  deploy:
    name: Despliegue en Azure
    needs: test
    runs-on: ubuntu-latest
    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}   # ej: eduaotiacr.azurecr.io
      ACR_NAME: ${{ secrets.ACR_NAME }}                   # ej: eduaotiacr
      RG: ${{ secrets.AZURE_RESOURCE_GROUP }}             # doitnow-rg
      LOCATION: ${{ secrets.AZURE_LOCATION }}             # eastus
      IMAGE_NAME: doitnow-frontend
      IMAGE_TAG: ${{ github.sha }}
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME || 'doitnow-frontend' }}
      DNS_LABEL: ${{ secrets.DNS_LABEL || 'doitnow-front-eduaoti' }}
    steps:
      - uses: actions/checkout@v4

      # Login a Azure con Service Principal (AZURE_CREDENTIALS)
      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validar sesión
        run: az account show

      # Login a ACR usando RBAC (sin user/pass); autentica el daemon de Docker
      - name: ACR RBAC Login (docker)
        run: az acr login -n "$ACR_NAME"

      # Build & push imagen al ACR
      - name: Build & Push Frontend
        run: |
          docker build --platform linux/amd64 -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG .
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

      # Desplegar en Azure Container Instances (ACI)
      # Para que ACI jale la imagen, usa admin user del ACR (por ahora)
      - name: Deploy to Azure Container Instances
        run: |
          CN="${CONTAINER_NAME:-doitnow-frontend}"
          DL="${DNS_LABEL:-doitnow-front-eduaoti}"

          az container delete -g "$RG" -n "$CN" -y || true

          az container create \
            --resource-group "$RG" \
            --name "$CN" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            --dns-name-label "$DL" \
            --location "$LOCATION" \
            --ports 80 \
            --os-type Linux \
            --cpu 1 \
            --memory 1.5 \
            --registry-login-server "$ACR_LOGIN_SERVER" \
            --registry-username "${{ secrets.ACR_USERNAME }}" \
            --registry-password "${{ secrets.ACR_PASSWORD }}" \
            --restart-policy Always

      - name: Mostrar estado
        run: |
          CN="${CONTAINER_NAME:-doitnow-frontend}"
          az container show -g "$RG" -n "$CN" \
            --query "{FQDN:ipAddress.fqdn,State:instanceView.state}" -o table

      - name: Logs (opcional)
        run: |
          CN="${CONTAINER_NAME:-doitnow-frontend}"
          az container logs -g "$RG" -n "$CN" || true
