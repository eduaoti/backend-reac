  deploy:
    name: Despliegue en Azure
    needs: test
    runs-on: ubuntu-latest
    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
      LOCATION: ${{ secrets.AZURE_LOCATION }}
      IMAGE_NAME: doitnow-frontend
      IMAGE_TAG: ${{ github.sha }}
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME || 'doitnow-frontend' }}
      DNS_LABEL: ${{ secrets.DNS_LABEL || 'doitnow-front-eduaoti' }}

      # ===== Front Door (HTTPS) =====
      AFD_PROFILE: fd-doitnow
      AFD_ENDPOINT: ep-doitnow
      AFD_ORIGIN_GROUP: og-frontend
      AFD_ORIGIN_NAME: origin-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validar sesión
        run: az account show

      - name: ACR RBAC Login (docker)
        run: az acr login -n "$ACR_NAME"

      - name: Build & Push Frontend (ACR)
        run: |
          docker build --platform linux/amd64 -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG .
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

      - name: Deploy to Azure Container Instances
        run: |
          CN="${CONTAINER_NAME:-doitnow-frontend}"
          DL="${DNS_LABEL:-doitnow-front-eduaoti}"

          az container delete -g "$RG" -n "$CN" -y || true

          az container create \
            --resource-group "$RG" \
            --name "$CN" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            --dns-name-label "$DL" \
            --location "$LOCATION" \
            --ports 80 \
            --os-type Linux \
            --cpu 1 \
            --memory 1.5 \
            --registry-login-server "$ACR_LOGIN_SERVER" \
            --registry-username "${{ secrets.ACR_USERNAME }}" \
            --registry-password "${{ secrets.ACR_PASSWORD }}" \
            --restart-policy Always

      # ================== HTTPS con Front Door ==================
      - name: Registrar provider Microsoft.Cdn (si aplica)
        run: az provider register --namespace Microsoft.Cdn --wait

      - name: Obtener FQDN de ACI (frontend)
        id: aci
        run: |
          FQDN=$(az container show -g "$RG" -n "${CONTAINER_NAME:-doitnow-frontend}" --query "ipAddress.fqdn" -o tsv)
          echo "fqdn=${FQDN}" >> $GITHUB_OUTPUT
          echo "ACI_FQDN: $FQDN"

      - name: Crear/usar Front Door Profile
        run: |
          az afd profile show -g "$RG" -n "$AFD_PROFILE" \
            || az afd profile create -g "$RG" -n "$AFD_PROFILE" --sku Standard_AzureFrontDoor

      - name: Crear/usar Endpoint HTTPS público
        run: |
          az afd endpoint show -g "$RG" --profile-name "$AFD_PROFILE" -n "$AFD_ENDPOINT" \
            || az afd endpoint create -g "$RG" --profile-name "$AFD_PROFILE" -n "$AFD_ENDPOINT" --enabled-state Enabled

      - name: Crear/usar Origin Group
        run: |
          az afd origin-group show -g "$RG" --profile-name "$AFD_PROFILE" -n "$AFD_ORIGIN_GROUP" \
            || az afd origin-group create -g "$RG" --profile-name "$AFD_PROFILE" -n "$AFD_ORIGIN_GROUP"

      - name: Crear/actualizar Origin (ACI FQDN)
        run: |
          ACI_FQDN="${{ steps.aci.outputs.fqdn }}"
          # si no hay FQDN todavía, usa la IP como host-name
          if [ -z "$ACI_FQDN" ]; then
            ACI_FQDN=$(az container show -g "$RG" -n "${CONTAINER_NAME:-doitnow-frontend}" --query "ipAddress.ip" -o tsv)
          fi
          # create or update
          az afd origin show -g "$RG" --profile-name "$AFD_PROFILE" \
            --origin-group-name "$AFD_ORIGIN_GROUP" -n "$AFD_ORIGIN_NAME" \
            && az afd origin update -g "$RG" --profile-name "$AFD_PROFILE" \
                 --origin-group-name "$AFD_ORIGIN_GROUP" -n "$AFD_ORIGIN_NAME" \
                 --host-name "$ACI_FQDN" --http-port 80 --https-port 443 --enabled-state Enabled \
            || az afd origin create -g "$RG" --profile-name "$AFD_PROFILE" \
                 --origin-group-name "$AFD_ORIGIN_GROUP" -n "$AFD_ORIGIN_NAME" \
                 --host-name "$ACI_FQDN" --http-port 80 --https-port 443 --enabled-state Enabled

      - name: Crear/usar Route (forzar HTTPS y forward HTTP)
        run: |
          az afd route show -g "$RG" --profile-name "$AFD_PROFILE" \
            --endpoint-name "$AFD_ENDPOINT" -n route-frontend \
          || az afd route create -g "$RG" --profile-name "$AFD_PROFILE" \
               --endpoint-name "$AFD_ENDPOINT" -n route-frontend \
               --origin-group "$AFD_ORIGIN_GROUP" \
               --supported-protocols Http Https \
               --https-redirect Enabled \
               --forwarding-protocol HttpOnly \
               --link-to-default-domain Enabled \
               --patterns "/*"

      - name: Mostrar URL HTTPS del Frontend
        run: |
          FD_HOST=$(az afd endpoint show -g "$RG" --profile-name "$AFD_PROFILE" -n "$AFD_ENDPOINT" --query "hostName" -o tsv)
          echo "Frontend HTTPS: https://${FD_HOST}"
      # =========================================================

      - name: Mostrar estado ACI
        run: |
          az container show -g "$RG" -n "${CONTAINER_NAME:-doitnow-frontend}" \
            --query "{FQDN:ipAddress.fqdn,State:instanceView.state}" -o table
