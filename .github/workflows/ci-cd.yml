name: CI/CD - Frontend (Tests, Build, Deploy + HTTPS)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

  deploy:
    name: Despliegue en Azure
    needs: test
    runs-on: ubuntu-latest

    env:
      # ===== Azure / ACR =====
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}     # ej: eduaotiacr.azurecr.io
      ACR_NAME:         ${{ secrets.ACR_NAME }}             # ej: eduaotiacr
      RG:               ${{ secrets.AZURE_RESOURCE_GROUP }} # ej: doitnow-rg
      LOCATION:         ${{ secrets.AZURE_LOCATION }}       # ej: eastus

      # ===== Imagen =====
      IMAGE_NAME: doitnow-frontend
      IMAGE_TAG:  ${{ github.sha }}

      # ===== ACI (si no pones secrets, se usan estos defaults) =====
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
      DNS_LABEL:      ${{ secrets.DNS_LABEL }}

      # ===== App Service (si no pones secrets, se generará nombre único) =====
      APP_SERVICE_PLAN: ${{ secrets.APP_SERVICE_PLAN }}   # default: doinow-plan
      WEBAPP_NAME:      ${{ secrets.WEBAPP_NAME }}        # default: auto-único

    steps:
      - uses: actions/checkout@v4

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validar sesión
        run: az account show

      - name: ACR RBAC Login (docker)
        run: az acr login -n "$ACR_NAME"

      - name: Build & Push Frontend (ACR)
        run: |
          docker build --platform linux/amd64 -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG .
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

      # ================== DESPLIEGUE A ACI (HTTP) ==================
      - name: Deploy a Azure Container Instances (ACI)
        run: |
          CN="${CONTAINER_NAME:-doitnow-frontend}"
          DL="${DNS_LABEL:-doitnow-front-eduaoti}"

          az container delete -g "$RG" -n "$CN" -y || true

          az container create \
            --resource-group "$RG" \
            --name "$CN" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            --dns-name-label "$DL" \
            --location "$LOCATION" \
            --ports 80 \
            --os-type Linux \
            --cpu 1 \
            --memory 1.5 \
            --registry-login-server "$ACR_LOGIN_SERVER" \
            --registry-username "${{ secrets.ACR_USERNAME }}" \
            --registry-password "${{ secrets.ACR_PASSWORD }}" \
            --restart-policy Always

      - name: Mostrar estado ACI (HTTP)
        run: |
          CN="${CONTAINER_NAME:-doitnow-frontend}"
          az container show -g "$RG" -n "$CN" \
            --query "{FQDN:ipAddress.fqdn,IP:ipAddress.ip,State:instanceView.state,Ports:ipAddress.ports}" -o table

      # ================== APP SERVICE (HTTPS) ==================
      - name: Esperar a que Microsoft.Web esté Registered
        run: |
          for i in {1..40}; do
            state=$(az provider show -n Microsoft.Web --query registrationState -o tsv || echo "Unknown")
            echo "Microsoft.Web registrationState=$state"
            if [ "$state" = "Registered" ]; then exit 0; fi
            sleep 10
          done
          echo "Timeout esperando Microsoft.Web=Registered"; exit 1

      - name: Crear/usar App Service Plan (Linux)
        run: |
          PLAN="${APP_SERVICE_PLAN:-doinow-plan}"
          az appservice plan show -g "$RG" -n "$PLAN" \
          || az appservice plan create -g "$RG" -n "$PLAN" --is-linux --sku B1 --location "$LOCATION"
          echo "APP_SERVICE_PLAN=$PLAN" >> $GITHUB_ENV

      - name: Crear/usar Web App for Containers (nombre único si no hay secret)
        run: |
          PLAN="$APP_SERVICE_PLAN"
          # Generar nombre único si no viene en secrets
          WN="${WEBAPP_NAME}"
          if [ -z "$WN" ]; then
            WN="doinow-front-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          fi
          WN=$(echo "$WN" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-')
          echo "Usando WEBAPP_NAME=$WN"

          if ! az webapp show -g "$RG" -n "$WN" >/dev/null 2>&1; then
            az webapp create -g "$RG" -p "$PLAN" -n "$WN" \
              --deployment-container-image-name "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          fi

          # Configurar contenedor (ACR + puerto 80)
          az webapp config container set -g "$RG" -n "$WN" \
            --docker-custom-image-name "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            --docker-registry-server-url "https://$ACR_LOGIN_SERVER" \
            --docker-registry-server-user "${{ secrets.ACR_USERNAME }}" \
            --docker-registry-server-password "${{ secrets.ACR_PASSWORD }}"

          az webapp config appsettings set -g "$RG" -n "$WN" \
            --settings WEBSITES_PORT=80

          echo "WEBAPP_NAME=$WN" >> $GITHUB_ENV

      - name: Reiniciar Web App
        run: az webapp restart -g "$RG" -n "$WEBAPP_NAME"

      - name: Mostrar URL HTTPS de App Service
        run: |
          HOST=$(az webapp show -g "$RG" -n "$WEBAPP_NAME" --query defaultHostName -o tsv)
          echo "Frontend HTTPS: https://${HOST}"
          echo "Nota: puede tardar ~1-2 min en arrancar la primera vez."
