name: CI/CD - Frontend (Tests, Build, Deploy + HTTPS)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

  deploy:
    name: Despliegue en Azure
    needs: test
    runs-on: ubuntu-latest

    env:
      # ===== Azure / ACR =====
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}   # ej. eduaotiacr.azurecr.io
      ACR_NAME:         ${{ secrets.ACR_NAME }}           # ej. eduaotiacr
      RG:               ${{ secrets.AZURE_RESOURCE_GROUP }}   # ej. doitnow-rg
      LOCATION:         ${{ secrets.AZURE_LOCATION }}         # ej. eastus

      # ===== Imagen =====
      IMAGE_NAME: doitnow-frontend
      IMAGE_TAG:  ${{ github.sha }}

      # ===== ACI ===== (fallbacks se hacen en bash)
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
      DNS_LABEL:      ${{ secrets.DNS_LABEL }}

      # ===== App Service (HTTPS) =====
      APP_SERVICE_PLAN: doinow-plan
      WEBAPP_NAME:      doinow-frontend-app

    steps:
      - uses: actions/checkout@v4

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validar sesión
        run: az account show

      - name: ACR RBAC Login (docker)
        run: az acr login -n "$ACR_NAME"

      - name: Build & Push Frontend (ACR)
        run: |
          docker build --platform linux/amd64 -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG .
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

      # ================== TU DESPLIEGUE ORIGINAL A ACI (HTTP) ==================
      - name: Deploy a Azure Container Instances (ACI)
        run: |
          CN="${CONTAINER_NAME:-doitnow-frontend}"
          DL="${DNS_LABEL:-doitnow-front-eduaoti}"

          az container delete -g "$RG" -n "$CN" -y || true

          az container create \
            --resource-group "$RG" \
            --name "$CN" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            --dns-name-label "$DL" \
            --location "$LOCATION" \
            --ports 80 \
            --os-type Linux \
            --cpu 1 \
            --memory 1.5 \
            --registry-login-server "$ACR_LOGIN_SERVER" \
            --registry-username "${{ secrets.ACR_USERNAME }}" \
            --registry-password "${{ secrets.ACR_PASSWORD }}" \
            --restart-policy Always

      - name: Mostrar estado ACI (HTTP)
        run: |
          CN="${CONTAINER_NAME:-doitnow-frontend}"
          az container show -g "$RG" -n "$CN" \
            --query "{FQDN:ipAddress.fqdn,IP:ipAddress.ip,State:instanceView.state,Ports:ipAddress.ports}" -o table

      # ================== NUEVO: PUBLICAR TAMBIÉN EN APP SERVICE (HTTPS) ==================
      # Esto te da https://<WEBAPP_NAME>.azurewebsites.net con TLS gestionado
      - name: Crear/usar App Service Plan (Linux)
        run: |
          az appservice plan show -g "$RG" -n "$APP_SERVICE_PLAN" \
          || az appservice plan create -g "$RG" -n "$APP_SERVICE_PLAN" \
               --is-linux --sku B1 --location "$LOCATION"

      - name: Crear/usar Web App for Containers
        run: |
          if ! az webapp show -g "$RG" -n "$WEBAPP_NAME" >/dev/null 2>&1; then
            az webapp create -g "$RG" -p "$APP_SERVICE_PLAN" -n "$WEBAPP_NAME" \
              --deployment-container-image-name "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          fi

          # Configurar contenedor (ACR + puerto 80 para Nginx)
          az webapp config container set -g "$RG" -n "$WEBAPP_NAME" \
            --docker-custom-image-name "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            --docker-registry-server-url "https://$ACR_LOGIN_SERVER" \
            --docker-registry-server-user "${{ secrets.ACR_USERNAME }}" \
            --docker-registry-server-password "${{ secrets.ACR_PASSWORD }}"

          az webapp config appsettings set -g "$RG" -n "$WEBAPP_NAME" \
            --settings WEBSITES_PORT=80

      - name: Reiniciar Web App
        run: az webapp restart -g "$RG" -n "$WEBAPP_NAME"

      - name: Mostrar URL HTTPS de App Service
        run: |
          HOST=$(az webapp show -g "$RG" -n "$WEBAPP_NAME" --query defaultHostName -o tsv)
          echo "Frontend HTTPS: https://${HOST}"
          echo "Nota: puede tardar ~1-2 min en arrancar el contenedor si es la primera vez."
