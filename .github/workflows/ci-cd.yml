name: CI/CD - Tests & Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

  deploy:
    name: Despliegue en Azure
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Login seguro en Azure usando credenciales en Secrets
      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Construir y publicar imagen en Docker Hub
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/doitnow-frontend ./frontend
          docker build -t ${{ secrets.DOCKER_USER }}/doitnow-backend ./backend
          echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin
          docker push ${{ secrets.DOCKER_USER }}/doitnow-frontend
          docker push ${{ secrets.DOCKER_USER }}/doitnow-backend

      # Despliegue en Azure Container Instances
      - name: Deploy to Azure
        run: |
          az container create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name doitnow-app \
            --image ${{ secrets.DOCKER_USER }}/doitnow-frontend \
            --dns-name-label doitnow-app-${{ github.run_id }} \
            --ports 80

      # Monitoreo y logs del contenedor
      - name: Mostrar logs
        run: az container logs --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name doitnow-app
