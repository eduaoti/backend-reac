server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # permite subir archivos más grandes (ajusta si quieres)
  client_max_body_size 20m;

  location / {
    try_files $uri /index.html;
  }

  # API -> backend (HTTPS App Service)
  location /api/ {
    proxy_http_version 1.1;
    proxy_ssl_server_name on;

    proxy_pass https://doinow-back-16-1.azurewebsites.net;

    # MUY IMPORTANTE: Host del backend (no el del frontend)
    proxy_set_header Host doinow-back-16-1.azurewebsites.net;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
  }

  # Uploads
  location /uploads/ {
    proxy_http_version 1.1;
    proxy_ssl_server_name on;

    # Puedes usar esta (preserva /uploads/ automáticamente):
    proxy_pass https://doinow-back-16-1.azurewebsites.net;

    proxy_set_header Host doinow-back-16-1.azurewebsites.net;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
    try_files $uri /index.html;
    expires 6M;
    access_log off;
    add_header Cache-Control "public";
  }
}
